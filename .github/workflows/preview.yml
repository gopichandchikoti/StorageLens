name: Build and publish previews

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storagelens-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Verify, build, install and smoke-test Windows
        shell: pwsh
        run: ./tools/ci_windows.ps1
      - name: Keep Windows verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-verification
          path: artifacts/verification
          retention-days: 14
      - name: Upload verified Windows preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-preview
          if-no-files-found: error
          path: |
            artifacts/release/StorageLens-Setup.exe
            artifacts/release/windows.json

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Load dedicated preview certificate for trusted builds
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          PREVIEW_KEY: ${{ secrets.PREVIEW_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_KEY"
          umask 077
          printf '%s' "$PREVIEW_KEY" | base64 --decode > "$RUNNER_TEMP/storagelens-preview.p12"
          echo "STORAGELENS_SIGNING_STORE_FILE=$RUNNER_TEMP/storagelens-preview.p12" >> "$GITHUB_ENV"
      - name: Enable the ephemeral emulator's KVM access
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Build, lint and test Android on API 35
        shell: bash
        env:
          STORAGELENS_SIGNING_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.PREVIEW_ANDROID_KEYSTORE_PASSWORD || '' }}
          EXPECTED_ANDROID_CERT_SHA256: ${{ vars.PREVIEW_ANDROID_CERT_SHA256 }}
        run: bash tools/ci_android.sh
      - name: Remove the temporary preview key
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/storagelens-preview.p12"
      - name: Keep Android verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-verification
          path: |
            artifacts/verification/android-ci
            Android/app/build/reports/lint-results-debug.html
            Android/app/build/test-results/testDebugUnitTest
          retention-days: 14
      - name: Upload verified Android preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-preview
          if-no-files-found: error
          path: |
            artifacts/release/StorageLens-Android.apk
            artifacts/release/android.json

  publish:
    needs: [windows, android]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # No repository checkout or project scripts execute with the publisher token.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-preview'
          path: release
          merge-multiple: true
      - name: Check digests and publish fixed-name preview downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_ANDROID_CERT_SHA256: ${{ vars.PREVIEW_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          folder=Path('release')
          records=[json.loads((folder/name).read_text()) for name in ['windows.json','android.json']]
          if records[0]['version']!=records[1]['version']:raise SystemExit('Platform versions differ')
          version=records[0]['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+',version):raise SystemExit('Invalid version')
          expected={'windows':'StorageLens-Setup.exe','android':'StorageLens-Android.apk'}
          for report in records:
              if report['commit']!=os.environ['GITHUB_SHA']:raise SystemExit('Artifact revision mismatch')
              if report['asset']!=expected[report['platform']]:raise SystemExit('Unexpected artifact name')
              with (folder/report['asset']).open('rb') as stream:
                  if hashlib.file_digest(stream,'sha256').hexdigest()!=report['sha256']:raise SystemExit('Artifact checksum mismatch')
          if records[1]['certificateSha256']!=os.environ['EXPECTED_ANDROID_CERT_SHA256']:raise SystemExit('Unexpected Android preview signer')
          def api(path):
              return json.loads(subprocess.check_output(['gh','api',path],text=True))
          repository=os.environ['GITHUB_REPOSITORY']
          head=api('repos/'+repository+'/commits/main')['sha']
          if head!=os.environ['GITHUB_SHA']:raise SystemExit('A newer default-branch revision exists; retain its downloads')
          existing=subprocess.run(['gh','release','view','latest-build','--repo',repository,'--json','assets'],text=True,capture_output=True)
          if existing.returncode==0:
              previous=next((a for a in json.loads(existing.stdout)['assets'] if a['name']=='manifest.json'),None)
              if previous:
                  # Never allow a lower Android code to replace an installed preview.
                  old=subprocess.run(['gh','release','download','latest-build','--repo',repository,'--pattern','manifest.json','--output','previous-manifest.json'],capture_output=True)
                  if old.returncode==0:
                      previous_manifest=json.loads(Path('previous-manifest.json').read_text())
                      if records[1]['androidVersionCode']<previous_manifest['android']['androidVersionCode']:raise SystemExit('Android version code regression')
          manifest={'version':version,'commit':os.environ['GITHUB_SHA'],'runUrl':records[0]['runUrl'],'windows':records[0],'android':records[1]}
          (folder/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          lines=[]
          for name in ['StorageLens-Setup.exe','StorageLens-Android.apk','manifest.json']:
              with (folder/name).open('rb') as stream:lines.append(hashlib.file_digest(stream,'sha256').hexdigest()+'  '+name)
          (folder/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n')
          notes=f'''StorageLens {version} rolling preview

          Source commit: {os.environ['GITHUB_SHA']}
          Verified build: {records[0]['runUrl']}

          Download StorageLens-Setup.exe for Windows x64 or StorageLens-Android.apk for Android 11+.
          Windows is an unsigned per-user preview requiring Microsoft Edge WebView2 Runtime.
          Android is debuggable and signed with a dedicated persistent preview certificate, not a production/store key.
          Android signer SHA-256: {records[1]['certificateSha256']}
          Earlier local Android Debug-signed APKs require uninstall before this signer can be installed; uninstall removes local phone scan records.

          Windows packaged scanner, install/UI/uninstall/data preservation and Android API 35 device tests passed in this build.
          Physical Android phones/OEM behavior and complete accessibility/coverage testing remain unverified.
          No personal scan data, inventory, credentials or private signing material are download assets.
          SHA256SUMS.txt and manifest.json identify the exact packages. This is not an antivirus.

          Rolling preview downloads refresh only after both platform checks pass. Source pushes do not silently publish failed packages.
          Restore a previously verified package from a historical run or immutable release for rollback; scan data migrations must be reviewed separately.
          '''
          (folder/'BUILD-NOTES.md').write_text(notes)
          (folder/'notes.txt').write_text(notes)
          PY
          if gh release view latest-build >/dev/null 2>&1; then
            gh release upload latest-build release/StorageLens-Setup.exe release/StorageLens-Android.apk release/SHA256SUMS.txt release/manifest.json release/BUILD-NOTES.md --clobber
            gh release edit latest-build --title 'Latest verified preview' --notes-file release/notes.txt --prerelease
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest-build" -f sha="$GITHUB_SHA" -F force=true
          else
            gh release create latest-build release/StorageLens-Setup.exe release/StorageLens-Android.apk release/SHA256SUMS.txt release/manifest.json release/BUILD-NOTES.md --target "$GITHUB_SHA" --title 'Latest verified preview' --notes-file release/notes.txt --prerelease
          fi
