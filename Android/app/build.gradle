import groovy.json.JsonSlurper
plugins { id 'com.android.application' }
def product = new JsonSlurper().parse(rootProject.file('../product.json'))
android {
    namespace 'com.portfolio.storagelens'
    compileSdk 36
    defaultConfig {
        applicationId product.androidApplicationId
        minSdk 30
        targetSdk 36
        versionCode product.androidVersionCode
        versionName product.version
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            if (System.getenv('STORAGELENS_SIGNING_STORE_FILE')) {
                storeFile file(System.getenv('STORAGELENS_SIGNING_STORE_FILE'))
                storePassword System.getenv('STORAGELENS_SIGNING_PASSWORD')
                keyAlias 'storagelens-preview'
                keyPassword System.getenv('STORAGELENS_SIGNING_PASSWORD')
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        release { minifyEnabled false }
        debug { applicationIdSuffix '.preview' }
    }
    lint { abortOnError true }
    testOptions { unitTests.returnDefaultValues = true }
    dependencyLocking {
        lockAllConfigurations()
        lockMode = LockMode.STRICT
    }
}
dependencies {
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
